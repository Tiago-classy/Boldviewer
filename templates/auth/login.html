{% extends 'base.html' %}
{% block title %}Sign in · BOLD Viewer{% endblock %}

{% block content %}
<div class="login-layout">
    <div class="login-intro">
        <span class="login-wordmark" aria-hidden="true">BOLD.</span>
        <p>Your files.<br> In focus.</p>
        <span class="muted">Images, films, and everything in between.</span>
    </div>
    <div class="login-panel">
        <h1>Sign in</h1>
        <p class="muted">Open your private media library.</p>
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button primary" type="submit">Open library {{ icon('arrow') }}</button>
        </form>
        <p class="login-note muted">Access is limited to your workspace members.</p>
    </div>
</div>
{% endblock %}
